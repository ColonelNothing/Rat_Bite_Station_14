- type: entity
  parent: [ClothingShoesBootsMagBase, BaseSecurityContraband]
  id: ClothingShoesBootsMagSec
  name: security magboots
  description: Magnetic boots, originally intended for patrolling the outside of the station, this version however has been outfitted with ID scanning measures along with Jackboot-adjacent perks, though this comes at the cost of making them slightly heavier than normal magboots
  components:
  - type: Sprite
    sprite: _BRatbite/Clothing/Shoes/Boots/magboots-sec.rsi
    state: icon
  - type: ToggleClothing
    action: ActionToggleSecMagboots
    mustEquip: false
  - type: Clothing
    sprite: _BRatbite/Clothing/Shoes/Boots/magboots-sec.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Plastic: 125
  - type: ClothingSpeedModifier # Sacrifices 25% movement speed when activated for advanced ID scanning and Jackboots while unactivated, along with being accessible in loadouts roundstart
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: AccessReader
    access: [["Security"]]
  - type: UnremovaeableOnToggle


- type: entity
  parent: BaseAction
  id: ActionToggleSecMagboots
  name: Toggle Magboots
  description: Toggles the magboots on and off.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent
  - type: DoAfterArgs
    delay: 1
    breakOnDamage: true
    breakOnWeightlessMove: false
    breakOnMove: true
